  <!-- Orbital rings -->
  <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#eab308" stroke-width="1.2" stroke-dasharray="2 1" transform="rotate(-30 16 16)"/>
  <ellipse cx="16" cy="16" rx="10" ry="8" stroke="#12e1e1" stroke-width="1" transform="rotate(30 16 16)"/>
  <!-- Central node -->
